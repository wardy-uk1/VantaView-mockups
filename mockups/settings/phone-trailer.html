<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Settings, Trailers (Phone)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;padding:20px 16px 0;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:12px">
<button aria-label="Back to Settings" style="width:44px;height:44px;border-radius:50%;border:1px solid #2C3150;background:#12141F;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<h1 style="margin:0;font-size:22px;font-weight:800">Trailer auto-play</h1>
</div>
<div style="border-radius:18px;background:#0C0E18;border:1px solid #2C3150;overflow:hidden">
<button style="width:100%;min-height:72px;border:0;background:transparent;color:#F2F4FA;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left;border-bottom:1px solid #1A1D2E"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:700 16px Inter,system-ui,sans-serif">Play trailers automatically</span><span style="font:500 13px Inter,system-ui,sans-serif;color:#9AA3B8">On movie and series details pages</span></span><span aria-hidden="true" style="width:52px;height:30px;border-radius:15px;background:linear-gradient(90deg,#7B5CFF,#14E0E0);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#F2F4FA"></span></span></button>
<button style="width:100%;min-height:72px;border:0;background:transparent;color:#F2F4FA;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:700 16px Inter,system-ui,sans-serif">Trailer sound</span><span style="font:500 13px Inter,system-ui,sans-serif;color:#9AA3B8">You can still mute each trailer</span></span><span aria-hidden="true" style="width:52px;height:30px;border-radius:15px;background:linear-gradient(90deg,#7B5CFF,#14E0E0);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#F2F4FA"></span></span></button>
</div>
<div style="color:#9AA3B8;font-size:12px;font-weight:700;letter-spacing:.12em;padding:4px 4px 0">START AFTER</div>
<div role="radiogroup" aria-label="Start after" style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
<button role="radio" aria-checked="false" style="height:64px;border-radius:16px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:700 18px Inter,system-ui,sans-serif">10s</button>
<button role="radio" aria-checked="true" style="height:64px;border-radius:16px;border:0;background:#16233A;box-shadow:0 0 0 2px #14E0E0;color:#F2F4FA;font:800 18px Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">20s<span style="font:600 11px Inter,system-ui,sans-serif;color:#14E0E0;letter-spacing:.06em">DEFAULT</span></button>
<button role="radio" aria-checked="false" style="height:64px;border-radius:16px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:700 18px Inter,system-ui,sans-serif">30s</button>
</div>
<div style="border-radius:16px;background:#12141F;border:1px solid #2C3150;padding:14px 16px;display:flex;gap:12px;align-items:flex-start"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="11" fill="#14E0E0"></circle><path d="M12 11v6M12 7.5v.5" stroke="#07080F" stroke-width="2.4" stroke-linecap="round"></path></svg><span style="color:#C3C9D8;font-size:14px;line-height:1.5">A countdown shows on the details page before the trailer starts. Pressing any button or scrolling cancels it for that title.</span></div>
</div>




</body></html>
