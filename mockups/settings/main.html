<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Settings, Live buffer (TV)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:1280px;height:720px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;padding:28px 48px 0;display:flex;flex-direction:column;gap:20px">

<div style="position:relative;display:flex;align-items:center;gap:24px;height:60px">
<button aria-label="Back" style="width:52px;height:52px;flex:none;border-radius:50%;border:1px solid #2C3150;background:#12141F;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<h1 style="margin:0;font-size:34px;font-weight:800">Settings</h1>
<label style="position:relative;display:block;width:420px"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search settings</span><input placeholder="Search settings" style="width:100%;height:52px;box-sizing:border-box;border-radius:26px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:500 17px Inter,system-ui,sans-serif;padding:0 18px 0 50px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:18px;top:16px"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg></label>
</div>
<div style="position:relative;flex:1;min-height:0;display:flex;gap:28px">
<nav aria-label="Settings list" style="width:440px;flex:none;display:flex;flex-direction:column;gap:4px;overflow:hidden">

<div style="color:#9AA3B8;font-size:14px;font-weight:700;letter-spacing:.12em;padding:12px 6px 6px">PLAYBACK</div>



<button style="height:68px;flex:none;border:0;border-radius:16px;background:#12141F;box-shadow:0 0 0 2px #14E0E0;color:#F2F4FA;padding:0 14px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:46px;height:46px;flex:none;border-radius:12px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v12H3zM8 21h8M12 17v4"></path></svg></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:600 18px Inter,system-ui,sans-serif;color:#14E0E0">Live buffer</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">Medium · Smart mode on</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>


<button style="height:68px;flex:none;border:0;border-radius:16px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 14px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:46px;height:46px;flex:none;border-radius:12px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:600 18px Inter,system-ui,sans-serif;color:#F2F4FA">Trailer auto-play</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">On · after 20 seconds · sound on</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>


<button style="height:68px;flex:none;border:0;border-radius:16px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 14px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:46px;height:46px;flex:none;border-radius:12px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"></path></svg></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:600 18px Inter,system-ui,sans-serif;color:#F2F4FA">Reminder time</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">5 minutes before</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>


<button style="height:68px;flex:none;border:0;border-radius:16px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 14px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:46px;height:46px;flex:none;border-radius:12px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM12 12h7v5h-7z"></path></svg></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:600 18px Inter,system-ui,sans-serif;color:#F2F4FA">Player controls</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">Hide after 5 seconds</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>


<button style="height:68px;flex:none;border:0;border-radius:16px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 14px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:46px;height:46px;flex:none;border-radius:12px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM12 12h7v5h-7z"></path></svg></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:600 18px Inter,system-ui,sans-serif;color:#F2F4FA">Mini player</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">Show on Home · starts muted</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>


<button style="height:68px;flex:none;border:0;border-radius:16px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 14px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:46px;height:46px;flex:none;border-radius:12px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 8l5-5 5 5M7 16l5 5 5-5"></path></svg></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:600 18px Inter,system-ui,sans-serif;color:#F2F4FA">Gestures</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">Swipe for volume and brightness</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>

</nav>
<section aria-label="Live buffer" style="flex:1;min-width:0;align-self:flex-start;border-radius:24px;background:#0C0E18;border:1px solid #2C3150;display:flex;flex-direction:column;overflow:hidden">
<div style="padding:26px 28px 6px;display:flex;align-items:center;gap:14px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg><h2 style="margin:0;font-size:26px;font-weight:800">Live buffer</h2></div>
<div style="padding:14px 28px 18px;display:flex;flex-direction:column;gap:10px">
<button style="height:70px;border-radius:16px;border:0;background:#12141F;box-shadow:0 0 0 2px #14E0E0;color:#F2F4FA;padding:0 20px;display:flex;align-items:center;gap:16px;text-align:left"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:700 18px Inter,system-ui,sans-serif">Smart mode</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">Raises the buffer on a channel that stalls, then eases it back</span></span><span aria-hidden="true" style="width:56px;height:32px;border-radius:16px;background:linear-gradient(90deg,#7B5CFF,#14E0E0);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#F2F4FA"></span></span></button>
<div style="color:#9AA3B8;font-size:13px;font-weight:700;letter-spacing:.12em;padding:8px 4px 0">STARTING BUFFER</div>

<button style="height:58px;border-radius:14px;border:0;background:#12141F;color:#F2F4FA;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font:600 17px Inter,system-ui,sans-serif"><span>Very low · fastest switching</span></button>

<button style="height:58px;border-radius:14px;border:0;background:#12141F;color:#F2F4FA;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font:600 17px Inter,system-ui,sans-serif"><span>Low</span></button>

<button style="height:58px;border-radius:14px;border:0;background:#16233A;color:#F2F4FA;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font:600 17px Inter,system-ui,sans-serif"><span>Medium · recommended</span><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#14E0E0"></circle><path d="M7 12.5l3.2 3L17 9" fill="none" stroke="#07080F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>

<button style="height:58px;border-radius:14px;border:0;background:#12141F;color:#F2F4FA;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font:600 17px Inter,system-ui,sans-serif"><span>Large · smoothest</span></button>

</div>
<div style="border-top:1px solid #2C3150;background:#12141F;padding:16px 28px;display:flex;gap:14px;align-items:flex-start"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="11" fill="#14E0E0"></circle><path d="M12 11v6M12 7.5v.5" stroke="#07080F" stroke-width="2.4" stroke-linecap="round"></path></svg><span style="color:#C3C9D8;font-size:15px;line-height:1.5">Lower values switch channels faster but need a steady connection. Higher values ride out drops better. If a stream cuts out, the app reconnects on its own.</span></div>
</section>
</div>
</div>
