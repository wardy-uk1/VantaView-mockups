<div style="margin:0 28px 22px;border-radius:16px;background:#12141F;border:1px solid #2C3150;padding:18px 20px;display:flex;flex-direction:column;gap:14px">

<span style="width:70px;height:104px;border-radius:10px;background:linear-gradient(160deg,#183C6E,#12141F);box-shadow:0 0 0 3px #12141F,0 0 0 6px #14E0E0,0 0 20px rgba(20,224,224,.45)"></span>
<span style="flex:1;height:6px;border-radius:3px;background:#2C3150"><span style="display:block;width:62%;height:6px;border-radius:3px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A)"></span></span>

<span style="color:#9AA3B8;font-size:14px">Used for buttons, focus rings and progress bars across the app.</span>
