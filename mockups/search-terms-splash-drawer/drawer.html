<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Menu drawer (Phone)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden">
<div aria-hidden="true" style="position:absolute;inset:0;padding:80px 16px 0;display:flex;flex-direction:column;gap:14px;opacity:.35">
<div style="height:200px;border-radius:16px;background:linear-gradient(135deg,#1E1546,#0E3A4A)"></div>
<div style="display:flex;gap:10px"><div style="width:118px;height:150px;border-radius:14px;background:#12141F"></div><div style="width:118px;height:150px;border-radius:14px;background:#12141F"></div><div style="width:118px;height:150px;border-radius:14px;background:#12141F"></div></div>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(4,5,10,.6)"></div>
<nav aria-label="Main menu" style="position:absolute;left:0;top:0;bottom:0;width:304px;box-sizing:border-box;background:#0C0E18;border-right:1px solid #2C3150;padding:22px 14px 20px;display:flex;flex-direction:column;gap:4px">
<svg aria-hidden="true" width="304" height="844" viewBox="0 0 304 844" fill="none" stroke-width="1.5" style="position:absolute;left:0;top:0;opacity:.07;pointer-events:none"><path d="M0 780H100L130 750H200" stroke="#14E0E0"></path><circle cx="200" cy="750" r="4" stroke="#14E0E0"></circle></svg>
<div style="position:relative;display:flex;align-items:center;gap:10px;padding:0 6px 14px">
<svg width="34" height="34" viewBox="0 0 44 44" role="img" aria-label="VantaView"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B5CFF"></stop><stop offset="1" stop-color="#14E0E0"></stop></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A14"></stop><stop offset=".5" stop-color="#FFC81A"></stop><stop offset="1" stop-color="#19E57A"></stop></linearGradient></defs><path d="M8 8L19 34" stroke="url(#gl)" stroke-width="7" stroke-linecap="round"></path><path d="M36 8L22 35" stroke="url(#gr)" stroke-width="7" stroke-linecap="round"></path><path d="M17 13L28 19L17 25Z" fill="#FF4F7A" stroke="#07080F" stroke-width="2" stroke-linejoin="round"></path></svg>
<span style="font-size:22px;font-weight:800">VantaView</span>
</div>
<button style="position:relative;height:64px;border:0;border-radius:14px;background:#12141F;color:#F2F4FA;padding:0 10px;display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:10px"><span style="width:42px;height:42px;flex:none;border-radius:50%;background:linear-gradient(150deg,#2F7BFF,#7B5CFF);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"></path></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font:700 15px Inter,system-ui,sans-serif">[Main profile]</span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">Switch profile</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>


<button style="position:relative;height:52px;border:0;border-radius:14px;background:linear-gradient(90deg,rgba(123,92,255,.25),rgba(20,224,224,.12));color:#F2F4FA;padding:0 12px;display:flex;align-items:center;gap:14px;font:700 16px Inter,system-ui,sans-serif;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"></path></svg><span style="flex:1">Home</span></button>


<button style="position:relative;height:52px;border:0;border-radius:14px;background:transparent;color:#C3C9D8;padding:0 12px;display:flex;align-items:center;gap:14px;font:600 16px Inter,system-ui,sans-serif;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v16H3zM8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"></path></svg><span style="flex:1">Movies</span></button>


<button style="position:relative;height:52px;border:0;border-radius:14px;background:transparent;color:#C3C9D8;padding:0 12px;display:flex;align-items:center;gap:14px;font:600 16px Inter,system-ui,sans-serif;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v13H3zM8 3l4 4 4-4"></path></svg><span style="flex:1">TV Series</span></button>


<button style="position:relative;height:52px;border:0;border-radius:14px;background:transparent;color:#C3C9D8;padding:0 12px;display:flex;align-items:center;gap:14px;font:600 16px Inter,system-ui,sans-serif;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 100 4 2 2 0 000-4zM7.5 7.5a6 6 0 000 9M16.5 7.5a6 6 0 010 9"></path></svg><span style="flex:1">Live TV</span></button>


<button style="position:relative;height:52px;border:0;border-radius:14px;background:transparent;color:#C3C9D8;padding:0 12px;display:flex;align-items:center;gap:14px;font:600 16px Inter,system-ui,sans-serif;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 01-8 0zM12 13v4M8 20h8M10 17h4"></path></svg><span style="flex:1">Sports</span></button>


<button style="position:relative;height:52px;border:0;border-radius:14px;background:transparent;color:#C3C9D8;padding:0 12px;display:flex;align-items:center;gap:14px;font:600 16px Inter,system-ui,sans-serif;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5 1-3 14-3.5-1z"></path></svg><span style="flex:1">Library</span><span style="background:#FF4F7A;color:#fff;border-radius:10px;padding:1px 8px;font:800 11px Inter,system-ui,sans-serif">2 new</span></button>

<span aria-hidden="true" style="display:block;height:1px;background:#2C3150;margin:8px 6px"></span>



<button style="position:relative;height:52px;border:0;border-radius:14px;background:transparent;color:#C3C9D8;padding:0 12px;display:flex;align-items:center;gap:14px;font:600 16px Inter,system-ui,sans-serif;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span style="flex:1">Add playlist</span></button>


<button style="position:relative;height:52px;border:0;border-radius:14px;background:transparent;color:#C3C9D8;padding:0 12px;display:flex;align-items:center;gap:14px;font:600 16px Inter,system-ui,sans-serif;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9a3 3 0 100 6 3 3 0 000-6zM12 3v3M12 18v3M3 12h3M18 12h3"></path></svg><span style="flex:1">Settings</span></button>

</nav>
</div>




</body></html>
