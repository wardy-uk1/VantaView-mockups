<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Add Playlist, Smart Add result (Phone)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;padding:20px 16px 0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px">
<button aria-label="Back" style="width:44px;height:44px;border-radius:50%;border:1px solid #2C3150;background:#12141F;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<h1 style="margin:0;font-size:24px;font-weight:800">Add Playlist</h1>
</div>
<div style="padding:2px;border-radius:16px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="width:100%;height:64px;border:0;border-radius:14px;background:#12141F;color:#F2F4FA;padding:0 14px;display:flex;align-items:center;gap:12px;text-align:left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#19E57A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.5 7.5a6 6 0 000 9M16.5 7.5a6 6 0 010 9M4.5 4.5a10 10 0 000 15M19.5 4.5a10 10 0 010 15"></path></svg><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font:800 15px Inter,system-ui,sans-serif">Try free channels</span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">Free public list by Free-TV/IPTV on GitHub</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></div>
<div style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">
<button style="flex:none;height:40px;padding:0 14px;border-radius:20px;border:2px solid #14E0E0;background:#1B1E2F;color:#F2F4FA;font:700 14px Inter,system-ui,sans-serif">Smart Add</button>
<button style="flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 14px Inter,system-ui,sans-serif">M3U link</button>
<button style="flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 14px Inter,system-ui,sans-serif">Xtream</button>
<button style="flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 14px Inter,system-ui,sans-serif">Stalker / MAC</button>
<button style="flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 14px Inter,system-ui,sans-serif">Addon</button>
<button style="flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 14px Inter,system-ui,sans-serif">Local file</button>
</div>
<label style="display:flex;flex-direction:column;gap:6px"><span style="color:#9AA3B8;font-size:13px;font-weight:600">Provider message</span><textarea style="height:84px;box-sizing:border-box;border-radius:12px;border:1px solid #2C3150;background:#12141F;color:#C3C9D8;font:500 13px Inter,system-ui,sans-serif;padding:10px 12px;resize:none;line-height:1.45">Thanks for subscribing! Host: [server address] User: [username] Pass: [password] Expires [date]</textarea></label>
<section aria-label="Details found" style="border-radius:16px;background:#0C0E18;border:1px solid #19E57A;padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#19E57A"></circle><path d="M7 12.5l3.2 3L17 9" fill="none" stroke="#07080F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font:800 15px Inter,system-ui,sans-serif">Found Xtream Codes login</span></div>
<label style="display:flex;flex-direction:column;gap:4px"><span style="color:#9AA3B8;font-size:12px;font-weight:600">Server</span><input value="[server address]" style="height:44px;box-sizing:border-box;border-radius:10px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:500 14px Inter,system-ui,sans-serif;padding:0 12px"></label>
<div style="display:flex;gap:8px">
<label style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="color:#9AA3B8;font-size:12px;font-weight:600">Username</span><input value="[username]" style="width:100%;height:44px;box-sizing:border-box;border-radius:10px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:500 14px Inter,system-ui,sans-serif;padding:0 12px"></label>
<label style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="color:#9AA3B8;font-size:12px;font-weight:600">Password</span><input type="password" value="password" style="width:100%;height:44px;box-sizing:border-box;border-radius:10px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:500 14px Inter,system-ui,sans-serif;padding:0 12px"></label>
</div>
<span style="color:#9AA3B8;font-size:12px">TV guide found automatically · Check the details, then add.</span>
</section>
<label style="display:flex;flex-direction:column;gap:6px"><span style="color:#9AA3B8;font-size:13px;font-weight:600">Playlist name</span><input value="My provider" style="height:46px;box-sizing:border-box;border-radius:12px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:500 15px Inter,system-ui,sans-serif;padding:0 12px"></label>
<div style="margin-top:auto;margin-bottom:20px;padding:2px;border-radius:28px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="width:100%;height:52px;border:0;border-radius:26px;background:#F2F4FA;color:#07080F;font:800 16px Inter,system-ui,sans-serif">Add playlist</button></div>
</div>




</body></html>
