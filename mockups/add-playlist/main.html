<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Add Playlist, Smart Add (TV)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:1280px;height:720px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;padding:28px 48px 0;display:flex;flex-direction:column;gap:18px">
<svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1280 720" fill="none" stroke-width="1.5" style="position:absolute;inset:0;opacity:.07;pointer-events:none"><path d="M0 680H200L230 650H360" stroke="#14E0E0"></path><circle cx="360" cy="650" r="5" stroke="#14E0E0"></circle><path d="M1280 40H1100L1070 70H960" stroke="#FF4FD8"></path><circle cx="960" cy="70" r="5" stroke="#FF4FD8"></circle></svg>
<div style="position:relative;display:flex;align-items:center;gap:20px;height:56px">
<button aria-label="Back" style="width:52px;height:52px;flex:none;border-radius:50%;border:1px solid #2C3150;background:#12141F;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<h1 style="margin:0;font-size:34px;font-weight:800">Add Playlist</h1>
</div>
<div style="position:relative;flex:1;min-height:0;display:flex;gap:28px">
<div style="width:420px;flex:none;display:flex;flex-direction:column;gap:12px">
<div style="padding:2px;border-radius:18px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="width:100%;height:84px;border:0;border-radius:16px;background:#12141F;color:#F2F4FA;padding:0 16px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:48px;height:48px;flex:none;border-radius:12px;background:#1B1E2F;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#19E57A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.5 7.5a6 6 0 000 9M16.5 7.5a6 6 0 010 9M4.5 4.5a10 10 0 000 15M19.5 4.5a10 10 0 010 15"></path></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:800 18px Inter,system-ui,sans-serif">Try free channels</span><span style="font:500 13px Inter,system-ui,sans-serif;color:#9AA3B8">Free public list by Free-TV/IPTV on GitHub</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></div>
<div style="color:#9AA3B8;font-size:14px;font-weight:700;letter-spacing:.12em;padding:8px 4px 0">YOUR OWN SOURCE</div>
<div style="display:flex;flex-direction:column;gap:4px">

<button style="height:56px;border:0;border-radius:14px;background:#12141F;box-shadow:0 0 0 2px #14E0E0;color:#F2F4FA;padding:0 12px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:38px;height:38px;flex:none;border-radius:10px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20L14 10M15 4v3M18 7h3M13 7h-1M15 9v1"></path></svg></span><span style="flex:1;font:600 17px Inter,system-ui,sans-serif;color:#14E0E0">Smart Add</span></button>

<button style="height:56px;border:0;border-radius:14px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 12px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:38px;height:38px;flex:none;border-radius:10px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"></path></svg></span><span style="flex:1;font:600 17px Inter,system-ui,sans-serif;color:#F2F4FA">From phone</span><span style="font:700 11px Inter,system-ui,sans-serif;letter-spacing:.06em;color:#07080F;background:#14E0E0;border-radius:6px;padding:3px 7px">EASIEST ON TV</span></button>

<button style="height:56px;border:0;border-radius:14px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 12px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:38px;height:38px;flex:none;border-radius:10px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"></path></svg></span><span style="flex:1;font:600 17px Inter,system-ui,sans-serif;color:#F2F4FA">M3U link</span></button>

<button style="height:56px;border:0;border-radius:14px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 12px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:38px;height:38px;flex:none;border-radius:10px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"></path></svg></span><span style="flex:1;font:600 17px Inter,system-ui,sans-serif;color:#F2F4FA">Xtream Codes</span></button>

<button style="height:56px;border:0;border-radius:14px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 12px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:38px;height:38px;flex:none;border-radius:10px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h16v6H4zM8 17h.01M12 14V9M9 6a4 4 0 016 0"></path></svg></span><span style="flex:1;font:600 17px Inter,system-ui,sans-serif;color:#F2F4FA">Stalker / MAC portal</span></button>

<button style="height:56px;border:0;border-radius:14px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 12px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:38px;height:38px;flex:none;border-radius:10px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4a2 2 0 014 0v2h4v4h-2a2 2 0 000 4h2v4h-4v-2a2 2 0 00-4 0v2H6v-4h2a2 2 0 000-4H6V6h4z"></path></svg></span><span style="flex:1;font:600 17px Inter,system-ui,sans-serif;color:#F2F4FA">Addon link</span></button>

<button style="height:56px;border:0;border-radius:14px;background:transparent;box-shadow:none;color:#F2F4FA;padding:0 12px;display:flex;align-items:center;gap:14px;text-align:left"><span style="width:38px;height:38px;flex:none;border-radius:10px;background:#12141F;border:1px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4"></path></svg></span><span style="flex:1;font:600 17px Inter,system-ui,sans-serif;color:#F2F4FA">Local file</span></button>

</div>
</div>
<section aria-label="Smart Add" style="flex:1;min-width:0;align-self:flex-start;border-radius:24px;background:#0C0E18;border:1px solid #2C3150;padding:24px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20L14 10M15 4v3M18 7h3M13 7h-1M15 9v1M19 3l1 1"></path></svg><h2 style="margin:0;font-size:24px;font-weight:800">Smart Add</h2></div>
<p style="margin:0;color:#C3C9D8;font-size:16px;line-height:1.5">Paste the message your provider sent you. We'll find the server, username and password, or the playlist link.</p>
<label style="display:flex;flex-direction:column;gap:6px"><span style="color:#9AA3B8;font-size:14px;font-weight:600">Playlist name</span><input value="My provider" style="height:52px;box-sizing:border-box;border-radius:14px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:500 17px Inter,system-ui,sans-serif;padding:0 16px"></label>
<label style="display:flex;flex-direction:column;gap:6px"><span style="color:#9AA3B8;font-size:14px;font-weight:600">Provider message</span><textarea placeholder="Paste provider message" style="height:110px;box-sizing:border-box;border-radius:14px;border:2px solid #14E0E0;background:#12141F;color:#F2F4FA;font:500 17px Inter,system-ui,sans-serif;padding:14px 16px;resize:none"></textarea></label>
<label style="display:flex;flex-direction:column;gap:6px"><span style="color:#9AA3B8;font-size:14px;font-weight:600">TV guide link (optional)</span><input placeholder="Found automatically for Xtream, or paste an EPG link" style="height:52px;box-sizing:border-box;border-radius:14px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:500 16px Inter,system-ui,sans-serif;padding:0 16px"></label>
<div style="display:flex;gap:12px;margin-top:4px">
<button style="flex:1;height:56px;border-radius:28px;border:1px solid #2C3150;background:#1A1D2E;color:#F2F4FA;font:700 17px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20L14 10M15 4v3M18 7h3"></path></svg>Find details</button>
<div style="flex:1;padding:2px;border-radius:30px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="width:100%;height:52px;border:0;border-radius:28px;background:#F2F4FA;color:#07080F;font:800 17px Inter,system-ui,sans-serif">Add playlist</button></div>
</div>
</section>
</div>
</div>
