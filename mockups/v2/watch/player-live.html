<!doctype html><html lang="en"><head><meta charset="utf-8"><title>VantaView V2 – Live player</title>
<meta name="viewport" content="width=device-width"><style>
*{box-sizing:border-box}html{background:#000}body{margin:0;display:flex;justify-content:center;font-family:Inter,system-ui,sans-serif}
.tv{position:relative;width:1280px;height:720px;background:#07080F;color:#F2F4FA;display:flex;overflow:hidden}
.ph{position:relative;width:390px;height:844px;background:#07080F;color:#F2F4FA;overflow:hidden;display:flex;flex-direction:column}
.rail{width:96px;flex:none;padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:10px;background:#0C0E18;border-right:1px solid #1A1D2E}
.ri{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#8A90A6}
.ri.on{background:rgba(110,84,230,.18);color:#B9AAFF}
.ri.focus{background:rgba(110,84,230,.18);color:#fff;box-shadow:inset 0 0 0 3px #6E54E6}
.main{flex:1;padding:28px 36px;display:flex;flex-direction:column;gap:18px;min-width:0}
h1{font-size:34px;margin:0;font-weight:800;letter-spacing:-.5px}h2{font-size:22px;margin:0;font-weight:700}h3{font-size:17px;margin:0;font-weight:700}
.sub{color:#9AA1B5;font-size:14px}.tiny{color:#9AA1B5;font-size:12px}
.row{display:flex;gap:16px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}
.card{background:#131626;border:1px solid #23273D;border-radius:16px}
.focus{box-shadow:0 0 0 3px #6E54E6}
.btn{height:48px;padding:0 24px;border-radius:14px;border:0;background:#6E54E6;color:#fff;font:600 16px Inter;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.btn.ghost{background:#1B1E2F;color:#F2F4FA;border:1px solid #2C3150}
.btn.f{box-shadow:0 0 0 3px #fff}
.pill{height:36px;padding:0 16px;border-radius:18px;background:#1B1E2F;color:#C3C9D8;font:600 14px Inter;display:inline-flex;align-items:center;border:1px solid #2C3150}
.pill.on{background:#6E54E6;color:#fff;border-color:#6E54E6}
.tab{padding:10px 18px;border-radius:12px;color:#9AA1B5;font-weight:600}.tab.on{background:#6E54E6;color:#fff}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:800 11px Inter;letter-spacing:.6px}
.live{background:#E5484D;color:#fff}.new{background:#FFC81A;color:#1A1400}.soon{background:#262A40;color:#9AA1B5}
.ok{background:rgba(25,229,122,.14);color:#4BE59A}.warn{background:rgba(255,200,26,.14);color:#FFD34D}.mut{background:#20243A;color:#9AA1B5}
.poster{border-radius:12px;flex:none;position:relative;overflow:hidden}
.bar{height:4px;background:#2A2E44;border-radius:2px;overflow:hidden}.bar>i{display:block;height:100%;background:#6E54E6}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-weight:800}
.input{height:52px;border-radius:14px;background:#0F1220;border:1px solid #2C3150;display:flex;align-items:center;padding:0 16px;color:#9AA1B5;font-size:16px;gap:10px}
.input.f{border:2px solid #6E54E6;color:#F2F4FA}
.sw{width:52px;height:30px;border-radius:15px;background:#2C3150;position:relative;flex:none}.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#9AA1B5}
.sw.on{background:#6E54E6}.sw.on::after{left:26px;background:#fff}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:#131626;border:1px solid #23273D}
.li .t{font-weight:600;font-size:16px}.grow{flex:1;min-width:0}
.ic{width:40px;height:40px;border-radius:12px;background:#1B1E2F;display:flex;align-items:center;justify-content:center;color:#B9AAFF;flex:none}
.scrim{position:absolute;inset:0;background:rgba(4,5,10,.72);display:flex;align-items:center;justify-content:center}
.dlg{width:560px;padding:32px;border-radius:24px;background:#131626;border:1px solid #2C3150;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:12px;padding:16px}
.sq{width:44px;height:44px;border-radius:14px;background:#131626;display:flex;align-items:center;justify-content:center;color:#F2F4FA;flex:none}
.trace{position:absolute;inset:0;opacity:.07;pointer-events:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2{position:absolute;right:14px;bottom:12px;font:700 11px Inter;letter-spacing:1px;color:#6B7190;background:#0F1220;border:1px solid #23273D;border-radius:6px;padding:3px 7px}
</style></head><body>
