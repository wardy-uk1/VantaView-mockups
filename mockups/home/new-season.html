<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – New season message (TV)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Bebas+Neue&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:1280px;height:720px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden">
<div aria-hidden="true" style="position:absolute;left:96px;top:0;right:0;bottom:0;padding:100px 32px 0;display:flex;flex-direction:column;gap:20px;opacity:.28">
<div style="display:flex;gap:16px"><div style="width:164px;height:220px;border-radius:18px;background:#12141F"></div><div style="width:164px;height:220px;border-radius:18px;background:#12141F"></div><div style="width:164px;height:220px;border-radius:18px;background:#12141F"></div><div style="width:164px;height:220px;border-radius:18px;background:#12141F"></div><div style="flex:1;height:220px;border-radius:18px;background:linear-gradient(135deg,#1E1546,#0E3A4A)"></div></div>
<div style="display:flex;gap:16px"><div style="width:256px;height:144px;border-radius:12px;background:#12141F"></div><div style="width:256px;height:144px;border-radius:12px;background:#12141F"></div><div style="width:256px;height:144px;border-radius:12px;background:#12141F"></div></div>
</div>
<div aria-hidden="true" style="position:absolute;left:0;top:0;bottom:0;width:96px;background:#0C0E18;border-right:1px solid #1A1D2E;opacity:.4"></div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(4,5,10,.6)"></div>
<section role="dialog" aria-label="New season available" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:700px;box-sizing:border-box;border-radius:24px;background:#12141F;border:1px solid #2C3150;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;display:flex">
<div style="position:relative;width:210px;flex:none;background:linear-gradient(160deg,#3B2A7A,#12141F)"><span style="position:absolute;left:14px;top:14px;background:#FFC81A;color:#07080F;font:800 12px Inter,system-ui,sans-serif;letter-spacing:.07em;padding:4px 9px;border-radius:6px">NEW SEASON</span></div>
<div style="flex:1;padding:28px 28px 26px;display:flex;flex-direction:column;gap:14px">
<span style="color:#FFC81A;font-size:14px;font-weight:800;letter-spacing:.1em">SEASON 3 IS HERE</span>
<h2 style="margin:0;font-family:'Bebas Neue',Inter,sans-serif;font-size:46px;font-weight:400;line-height:.95">[SERIES TITLE]</h2>
<span style="color:#C3C9D8;font-size:16px;line-height:1.5">10 new episodes are ready to watch. Pick up with S3 E1.</span>
<div style="display:flex;gap:12px;margin-top:6px">
<button style="flex:1;height:54px;border-radius:27px;border:1px solid #2C3150;background:#1A1D2E;color:#F2F4FA;font:700 17px Inter,system-ui,sans-serif">Later</button>
<div style="flex:1;padding:2px;border-radius:29px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14);box-shadow:0 0 22px rgba(20,224,224,.35)"><button style="width:100%;height:50px;border:0;border-radius:27px;background:#F2F4FA;color:#07080F;font:800 17px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="#07080F" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>Watch now</button></div>
</div>
</div>
</section>
</div>
