<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Event details (TV)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:1280px;height:720px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center">
<div aria-hidden="true" style="position:absolute;inset:0;padding:28px 40px 28px 136px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;opacity:.25">
<div style="font-size:38px;font-weight:800">Sports</div>
<div style="display:flex;gap:16px"><div style="flex:1;height:178px;border-radius:16px;background:#12141F"></div><div style="flex:1;height:178px;border-radius:16px;background:#12141F"></div><div style="flex:1;height:178px;border-radius:16px;background:#12141F"></div></div>
<div style="display:flex;gap:16px"><div style="flex:1;height:132px;border-radius:16px;background:#12141F"></div><div style="flex:1;height:132px;border-radius:16px;background:#12141F"></div><div style="flex:1;height:132px;border-radius:16px;background:#12141F"></div><div style="flex:1;height:132px;border-radius:16px;background:#12141F"></div></div>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(4,5,10,.6)"></div>
<section role="dialog" aria-label="Event details" style="position:relative;width:780px;box-sizing:border-box;border-radius:24px;background:#12141F;border:1px solid #2C3150;padding:36px 40px;display:flex;flex-direction:column;gap:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)">
<svg aria-hidden="true" width="780" height="120" viewBox="0 0 780 120" fill="none" stroke-width="1.5" style="position:absolute;right:0;top:0;opacity:.14;pointer-events:none"><path d="M780 30H600L570 60H440" stroke="#14E0E0"></path><path d="M780 90H660L630 60" stroke="#FF4FD8"></path><circle cx="440" cy="60" r="4" stroke="#14E0E0"></circle></svg>
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:10px"><span style="background:#1B1E2F;border:1px solid #14E0E0;color:#14E0E0;font-size:14px;font-weight:700;letter-spacing:.06em;padding:5px 10px;border-radius:8px">COMING UP</span><span style="color:#9AA3B8;font-size:18px">Football</span></div>
<button aria-label="Close" style="width:48px;height:48px;border-radius:50%;border:1px solid #2C3150;background:#1A1D2E;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:24px">
<div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:200px"><div style="width:84px;height:84px;border-radius:50%;background:#1A1D2E;border:2px solid #7B5CFF;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800">E</div><span style="font-size:24px;font-weight:700">Team E</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:44px;font-weight:800">20:00</span><span style="color:#9AA3B8;font-size:18px">Today · 20:00 – 22:00</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:200px"><div style="width:84px;height:84px;border-radius:50%;background:#1A1D2E;border:2px solid #FF5A14;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800">F</div><span style="font-size:24px;font-weight:700">Team F</span></div>
</div>
<div style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;background:#0C0E18">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.5 7.5a6 6 0 000 9M16.5 7.5a6 6 0 010 9"></path></svg>
<span style="font-size:18px;font-weight:600">Sports Channel 4</span>
<span style="color:#9AA3B8;font-size:16px;margin-left:auto">[League or competition]</span>
</div>
<p style="margin:0;color:#C3C9D8;font-size:17px;line-height:1.5">[Programme description from the TV guide, when the guide provides one.]</p>
<div style="display:flex;gap:16px">
<div style="flex:1;padding:3px;border-radius:30px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="width:100%;height:58px;border:0;border-radius:27px;background:#1A1D2E;color:#F2F4FA;font:700 20px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:12px"><span style="width:14px;height:14px;border-radius:50%;background:#FF3B4E"></span>Record</button></div>
<div style="flex:1;padding:3px;border-radius:30px"><button style="width:100%;height:58px;border:1px solid #2C3150;border-radius:27px;background:#1A1D2E;color:#F2F4FA;font:700 20px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"></path></svg>Remind me</button></div>
</div>
<span style="color:#9AA3B8;font-size:15px;text-align:center">Reminders pop up 5 minutes before the start, with a button to jump to the channel.</span>
</section>
</div>




</body></html>
