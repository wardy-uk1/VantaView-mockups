<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Event details (Phone)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden">
<div aria-hidden="true" style="position:absolute;inset:0;padding:24px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;opacity:.25">
<div style="font-size:28px;font-weight:800;padding-left:56px">Sports</div>
<div style="height:44px;border-radius:22px;background:#12141F;width:70%"></div>
<div style="height:156px;border-radius:16px;background:#12141F"></div>
<div style="height:76px;border-radius:14px;background:#12141F"></div>
<div style="height:76px;border-radius:14px;background:#12141F"></div>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(4,5,10,.6)"></div>
<section role="dialog" aria-label="Event details" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;border-radius:24px 24px 0 0;background:#12141F;border-top:1px solid #2C3150;padding:12px 20px 28px;display:flex;flex-direction:column;gap:18px">
<div aria-hidden="true" style="align-self:center;width:44px;height:5px;border-radius:3px;background:#2C3150"></div>
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:8px"><span style="background:#1B1E2F;border:1px solid #14E0E0;color:#14E0E0;font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:6px">COMING UP</span><span style="color:#9AA3B8;font-size:15px">Football</span></div>
<button aria-label="Close" style="width:44px;height:44px;border-radius:50%;border:1px solid #2C3150;background:#1A1D2E;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:96px"><div style="width:60px;height:60px;border-radius:50%;background:#1A1D2E;border:2px solid #7B5CFF;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800">E</div><span style="font-size:16px;font-weight:700">Team E</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="font-size:32px;font-weight:800">20:00</span><span style="color:#9AA3B8;font-size:14px">Today · until 22:00</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:96px"><div style="width:60px;height:60px;border-radius:50%;background:#1A1D2E;border:2px solid #FF5A14;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800">F</div><span style="font-size:16px;font-weight:700">Team F</span></div>
</div>
<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#0C0E18">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.5 7.5a6 6 0 000 9M16.5 7.5a6 6 0 010 9"></path></svg>
<span style="font-size:15px;font-weight:600">Sports Channel 4</span>
<span style="color:#9AA3B8;font-size:13px;margin-left:auto">[Competition]</span>
</div>
<p style="margin:0;color:#C3C9D8;font-size:15px;line-height:1.5">[Programme description from the TV guide, when the guide provides one.]</p>
<div style="padding:2px;border-radius:28px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="width:100%;height:52px;border:0;border-radius:26px;background:#1A1D2E;color:#F2F4FA;font:700 17px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:12px;height:12px;border-radius:50%;background:#FF3B4E"></span>Record</button></div>
<button style="width:100%;height:52px;border:1px solid #2C3150;border-radius:26px;background:#1A1D2E;color:#F2F4FA;font:700 17px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"></path></svg>Remind me</button>
<span style="color:#9AA3B8;font-size:13px;text-align:center">You'll get a notification 5 minutes before the start.</span>
</section>
</div>




</body></html>
