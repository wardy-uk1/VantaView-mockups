<!doctype html>

<title>VantaView – Actor page (Phone)</title>

<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;padding:20px 16px 0;display:flex;flex-direction:column;gap:14px">
<div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:230px;background:linear-gradient(180deg,#12141F 0%,#07080F 100%)"></div>
<div style="position:relative;display:flex;align-items:center;gap:14px">
<button aria-label="Back to movie" style="width:44px;height:44px;flex:none;border-radius:50%;border:1px solid #2C3150;background:#1A1D2E;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
</div>

</div>
<p style="position:relative;margin:0;color:#C3C9D8;font-size:14px;line-height:1.5">[Short biography from the movie database, cut to three lines…] <span style="color:#14E0E0;font-weight:700">Read more</span></p>
<div role="tablist" aria-label="Filmography" style="position:relative;display:flex;gap:8px">
<button role="tab" aria-selected="false" style="flex:1;height:44px;border-radius:22px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 15px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px">Available<span style="background:#2C3150;border-radius:10px;padding:1px 8px;font-size:12px">24</span></button>
<button role="tab" aria-selected="true" style="flex:1;height:44px;border-radius:22px;border:0;background:#F2F4FA;color:#07080F;font:800 15px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px">All<span style="background:#07080F;color:#F2F4FA;border-radius:10px;padding:1px 8px;font-size:12px">61</span></button>
</div>
<div style="position:relative;display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">
<button style="flex:none;height:40px;padding:0 14px;border-radius:20px;border:2px solid #14E0E0;background:#1B1E2F;color:#F2F4FA;font:700 14px Inter,system-ui,sans-serif">Movies &amp; series</button>
<button style="flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 14px Inter,system-ui,sans-serif;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14E0E0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Newest first</button>
</div>
<div style="position:relative;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px 10px">
