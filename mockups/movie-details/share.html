<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Share to a profile (TV)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Bebas+Neue&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:1280px;height:720px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden">
<div aria-hidden="true" style="position:absolute;right:0;top:0;width:820px;height:520px;background:linear-gradient(135deg,#1E1546 0%,#0E3A4A 55%,#3A2410 100%)"></div>
<div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(90deg,#07080F 0%,#07080F 34%,rgba(7,8,15,.55) 60%,rgba(7,8,15,0) 100%)"></div>
<div aria-hidden="true" style="position:absolute;left:64px;top:110px;opacity:.3;font-family:'Bebas Neue',Inter,sans-serif;font-size:84px;line-height:.9">[MOVIE TITLE ART]</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(4,5,10,.62)"></div>
<section role="dialog" aria-label="Share to a profile" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;box-sizing:border-box;border-radius:24px;background:#12141F;border:1px solid #2C3150;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:30px 34px;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;align-items:center;gap:16px">
<span style="width:56px;height:84px;flex:none;border-radius:8px;background:linear-gradient(160deg,#3B2A7A,#12141F)"></span>
<div style="flex:1;display:flex;flex-direction:column;gap:4px"><h2 style="margin:0;font-size:24px;font-weight:800">Share to a profile</h2><span style="color:#9AA3B8;font-size:16px">[Movie title] · 2026 · Movie</span></div>
<button aria-label="Close" style="width:48px;height:48px;border-radius:50%;border:1px solid #2C3150;background:#1A1D2E;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display:flex;gap:26px;justify-content:center">

<button role="checkbox" aria-checked="true" style="width:150px;border:0;background:transparent;color:#F2F4FA;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:1">
<span style="position:relative;display:flex;width:118px;height:118px;border-radius:50%;background:linear-gradient(150deg,#FF4FD8,#7B5CFF);box-shadow:0 0 0 3px #12141F, 0 0 0 5px #14E0E0;align-items:center;justify-content:center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a6 6 0 100 12 6 6 0 000-12zM3 14c3 2 15-2 18-6"></path></svg>
<span style="position:absolute;right:2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:#14E0E0;border:3px solid #12141F;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#07080F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
</span>
<span style="font:700 18px Inter,system-ui,sans-serif">[Profile 2]</span>
<span style="margin-top:-6px;font:500 13px Inter,system-ui,sans-serif;color:#9AA3B8;text-align:center">Selected</span>
</button>

<button role="checkbox" aria-checked="false" style="width:150px;border:0;background:transparent;color:#F2F4FA;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:1">
<span style="position:relative;display:flex;width:118px;height:118px;border-radius:50%;background:linear-gradient(150deg,#FFC81A,#FF5A14);box-shadow:0 0 0 4px #12141F, 0 0 0 7px #14E0E0, 0 0 24px rgba(20,224,224,.45);align-items:center;justify-content:center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>

</span>
<span style="font:700 18px Inter,system-ui,sans-serif">[Profile 3]</span>
<span style="margin-top:-6px;font:500 13px Inter,system-ui,sans-serif;color:#9AA3B8;text-align:center"></span>
</button>

<button role="checkbox" aria-checked="false" style="width:150px;border:0;background:transparent;color:#F2F4FA;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:.4">
<span style="position:relative;display:flex;width:118px;height:118px;border-radius:50%;background:linear-gradient(150deg,#19E57A,#14E0E0);box-shadow:none;align-items:center;justify-content:center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c4 3 5 8 3 13H9C7 10 8 5 12 2zM9 15l-3 4M15 15l3 4M12 9h.01"></path></svg>

</span>
<span style="font:700 18px Inter,system-ui,sans-serif">[Kids]</span>
<span style="margin-top:-6px;font:500 13px Inter,system-ui,sans-serif;color:#9AA3B8;text-align:center">Outside their limits</span>
</button>

</div>
<div style="display:flex;align-items:center;gap:14px;padding-top:4px;border-top:1px solid #2C3150">
<span style="flex:1;color:#9AA3B8;font-size:15px;padding-top:14px">They'll find it in <span style="color:#F2F4FA;font-weight:700">Library › Shared with you</span>, with a message next time they open the app.</span>
<div style="padding:2px;border-radius:30px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14);margin-top:14px"><button style="height:52px;padding:0 34px;border:0;border-radius:28px;background:#F2F4FA;color:#07080F;font:800 17px Inter,system-ui,sans-serif">Share</button></div>
</div>
</section>
</div>




</body></html>
