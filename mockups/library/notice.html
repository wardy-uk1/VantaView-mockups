<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Shared message on opening (TV)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:1280px;height:720px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden">
<div aria-hidden="true" style="position:absolute;left:96px;top:0;right:0;bottom:0;padding:110px 40px 0;display:flex;flex-direction:column;gap:20px;opacity:.28">
<div style="display:flex;gap:16px"><div style="width:220px;height:200px;border-radius:16px;background:#12141F"></div><div style="width:220px;height:200px;border-radius:16px;background:#12141F"></div><div style="width:220px;height:200px;border-radius:16px;background:#12141F"></div><div style="flex:1;height:200px;border-radius:16px;background:linear-gradient(135deg,#1E1546,#0E3A4A)"></div></div>
<div style="display:flex;gap:16px"><div style="width:180px;height:110px;border-radius:14px;background:#12141F"></div><div style="width:180px;height:110px;border-radius:14px;background:#12141F"></div><div style="width:180px;height:110px;border-radius:14px;background:#12141F"></div></div>
</div>
<div aria-hidden="true" style="position:absolute;left:0;top:0;bottom:0;width:96px;background:#0C0E18;border-right:1px solid #1A1D2E;opacity:.4"></div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(4,5,10,.55)"></div>
<section role="dialog" aria-label="Shared with you" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;box-sizing:border-box;border-radius:24px;background:#12141F;border:1px solid #2C3150;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:30px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:14px"><span style="width:52px;height:52px;flex:none;border-radius:50%;background:linear-gradient(150deg,#FF4FD8,#7B5CFF);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a6 6 0 100 12 6 6 0 000-12zM3 14c3 2 15-2 18-6"></path></svg></span><h2 style="margin:0;font-size:24px;font-weight:800;line-height:1.25">[Profile 2] shared 2 titles with you</h2></div>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:14px;padding:10px;border-radius:14px;background:#1A1D2E"><span style="width:48px;height:72px;flex:none;border-radius:8px;background:linear-gradient(160deg,#3B2A7A,#12141F)"></span><span style="display:flex;flex-direction:column;gap:3px"><span style="font:700 17px Inter,system-ui,sans-serif">[Movie title]</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">Movie · 2026</span></span></div>
<div style="display:flex;align-items:center;gap:14px;padding:10px;border-radius:14px;background:#1A1D2E"><span style="width:48px;height:72px;flex:none;border-radius:8px;background:linear-gradient(160deg,#183C6E,#12141F)"></span><span style="display:flex;flex-direction:column;gap:3px"><span style="font:700 17px Inter,system-ui,sans-serif">[Series title]</span><span style="font:500 14px Inter,system-ui,sans-serif;color:#9AA3B8">Series · 3 seasons</span></span></div>
</div>
<div style="display:flex;gap:12px">
<button style="flex:1;height:54px;border-radius:27px;border:1px solid #2C3150;background:#1A1D2E;color:#F2F4FA;font:700 17px Inter,system-ui,sans-serif">Later</button>
<div style="flex:1;padding:2px;border-radius:29px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14);box-shadow:0 0 22px rgba(20,224,224,.35)"><button style="width:100%;height:50px;border:0;border-radius:27px;background:#F2F4FA;color:#07080F;font:800 17px Inter,system-ui,sans-serif">Open Library</button></div>
</div>
</section>
</div>




</body></html>
