<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Add another profile (Phone)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;padding:20px 16px 0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px">
<button aria-label="Back" style="width:44px;height:44px;border-radius:50%;border:1px solid #2C3150;background:#12141F;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<h1 style="margin:0;font-size:22px;font-weight:800">Add profile</h1>
</div>
<div style="display:flex;align-items:center;gap:14px">
<div style="padding:3px;border-radius:50%;background:linear-gradient(135deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><span style="display:flex;width:84px;height:84px;border-radius:50%;overflow:hidden"><svg aria-hidden="true" width="84" height="84" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#1F6B6B"/><path d="M60 24c19 0 29 13 29 30v8H31v-8c0-17 10-30 29-30z" fill="#2B2118"/><path d="M60 32c15 0 25 11 25 26 0 18-11 32-25 32S35 76 35 58c0-15 10-26 25-26z" fill="#C98B5E"/><path d="M60 26c18 0 28 11 29 25-6-6-16-9-29-9s-23 3-29 9c1-14 11-25 29-25z" fill="#2B2118"/><circle cx="49" cy="58" r="4" fill="#241A14"/><circle cx="71" cy="58" r="4" fill="#241A14"/><path d="M51 74 q9 8 18 0" stroke="#241A14" stroke-width="3" fill="none" stroke-linecap="round"/></svg></span></div>
<label style="flex:1;display:flex;flex-direction:column;gap:6px"><span style="color:#9AA3B8;font-size:13px;font-weight:600">Profile name</span><input placeholder="Name" style="height:48px;box-sizing:border-box;border-radius:12px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 16px Inter,system-ui,sans-serif;padding:0 14px"></label>
</div>
<div style="display:grid;grid-template-columns:repeat(8, minmax(0, 1fr));gap:6px">

<button aria-label="Fox avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;overflow:hidden"><svg aria-hidden="true" width="100%" height="100%" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#22304A"/><path d="M28 48 L23 18 L50 34 Z" fill="#C85A26"/><path d="M92 48 L97 18 L70 34 Z" fill="#C85A26"/><path d="M60 28c20 0 34 16 34 34 0 20-15 32-34 32S26 82 26 62c0-18 14-34 34-34z" fill="#F0813C"/><path d="M60 68c11 0 20 7 20 15s-9 13-20 13-20-5-20-13 9-15 20-15z" fill="#FFF1E2"/><circle cx="47" cy="57" r="5.5" fill="#241A14"/><circle cx="73" cy="57" r="5.5" fill="#241A14"/><circle cx="49" cy="55" r="2" fill="#FFF"/><circle cx="75" cy="55" r="2" fill="#FFF"/><ellipse cx="60" cy="77" rx="6" ry="4.5" fill="#241A14"/></svg></button>

<button aria-label="Panda avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;overflow:hidden"><svg aria-hidden="true" width="100%" height="100%" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#2A6B5C"/><circle cx="33" cy="36" r="13" fill="#2B2B33"/><circle cx="87" cy="36" r="13" fill="#2B2B33"/><circle cx="60" cy="62" r="33" fill="#F7F5F0"/><ellipse cx="46" cy="56" rx="10" ry="12.5" fill="#2B2B33" transform="rotate(-14 46 56)"/><ellipse cx="74" cy="56" rx="10" ry="12.5" fill="#2B2B33" transform="rotate(14 74 56)"/><circle cx="47" cy="57" r="4" fill="#FFF"/><circle cx="73" cy="57" r="4" fill="#FFF"/><ellipse cx="60" cy="74" rx="6.5" ry="4.5" fill="#2B2B33"/><path d="M53 81 q7 6 14 0" stroke="#2B2B33" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></button>

<button aria-label="Bot avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;overflow:hidden"><svg aria-hidden="true" width="100%" height="100%" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#1B3A52"/><circle cx="60" cy="22" r="4.5" fill="#FFC94D"/><path d="M60 27 v11" stroke="#7E95A8" stroke-width="3.5" stroke-linecap="round"/><rect x="19" y="54" width="9" height="20" rx="4.5" fill="#7E95A8"/><rect x="92" y="54" width="9" height="20" rx="4.5" fill="#7E95A8"/><rect x="29" y="37" width="62" height="52" rx="13" fill="#A9BFD0"/><rect x="37" y="49" width="46" height="24" rx="9" fill="#15242E"/><circle cx="50" cy="61" r="5.5" fill="#4FD6C4"/><circle cx="70" cy="61" r="5.5" fill="#4FD6C4"/><rect x="46" y="79" width="28" height="5" rx="2.5" fill="#15242E"/></svg></button>

<button aria-label="Alien avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;overflow:hidden"><svg aria-hidden="true" width="100%" height="100%" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#2B5C39"/><path d="M60 24c19 0 31 14 31 31 0 21-15 39-31 39S29 76 29 55c0-17 12-31 31-31z" fill="#9BE86B"/><ellipse cx="46" cy="55" rx="9" ry="13.5" fill="#15230F" transform="rotate(-20 46 55)"/><ellipse cx="74" cy="55" rx="9" ry="13.5" fill="#15230F" transform="rotate(20 74 55)"/><circle cx="44.5" cy="50" r="3.2" fill="#D9FFC0"/><circle cx="72.5" cy="50" r="3.2" fill="#D9FFC0"/><path d="M52 79 q8 7 16 0" stroke="#3E7A2A" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button>

<button aria-label="Mika avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:none;box-shadow:0 0 0 3px #07080F, 0 0 0 5px #F2F4FA;display:flex;align-items:center;justify-content:center;overflow:hidden"><svg aria-hidden="true" width="100%" height="100%" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#1F6B6B"/><path d="M60 24c19 0 29 13 29 30v8H31v-8c0-17 10-30 29-30z" fill="#2B2118"/><path d="M60 32c15 0 25 11 25 26 0 18-11 32-25 32S35 76 35 58c0-15 10-26 25-26z" fill="#C98B5E"/><path d="M60 26c18 0 28 11 29 25-6-6-16-9-29-9s-23 3-29 9c1-14 11-25 29-25z" fill="#2B2118"/><circle cx="49" cy="58" r="4" fill="#241A14"/><circle cx="71" cy="58" r="4" fill="#241A14"/><path d="M51 74 q9 8 18 0" stroke="#241A14" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button>

<button aria-label="Nova avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;overflow:hidden"><svg aria-hidden="true" width="100%" height="100%" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#36256E"/><path d="M60 26c18 0 28 12 28 28v8H32v-8c0-16 10-28 28-28z" fill="#E36BA8"/><path d="M60 32c15 0 25 11 25 26 0 18-11 32-25 32S35 76 35 58c0-15 10-26 25-26z" fill="#E8B894"/><path d="M60 27c17 0 27 10 28 23-6-7-15-11-28-11s-22 4-28 11c1-13 11-23 28-23z" fill="#E36BA8"/><path d="M30 60v-6a30 30 0 0 1 60 0v6" fill="none" stroke="#2B2B38" stroke-width="5" stroke-linecap="round"/><rect x="22" y="56" width="13" height="22" rx="6.5" fill="#2B2B38"/><rect x="85" y="56" width="13" height="22" rx="6.5" fill="#2B2B38"/><rect x="25" y="60" width="7" height="14" rx="3.5" fill="#6FE0D4"/><rect x="88" y="60" width="7" height="14" rx="3.5" fill="#6FE0D4"/><circle cx="49" cy="58" r="4" fill="#2B2118"/><circle cx="71" cy="58" r="4" fill="#2B2118"/><path d="M52 74 q8 7 16 0" stroke="#2B2118" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button>

<button aria-label="Knight avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;overflow:hidden"><svg aria-hidden="true" width="100%" height="100%" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#4A1F2E"/><path d="M50 16 q10 -9 20 0 l-5 24 h-10z" fill="#E05A5A"/><path d="M60 24c17 0 28 12 28 30 0 22-12 38-28 38S32 76 32 54c0-18 11-30 28-30z" fill="#B8C2CC"/><path d="M60 24c17 0 28 12 28 30v4H32v-4c0-18 11-30 28-30z" fill="#D4DCE4"/><rect x="37" y="51" width="46" height="13" rx="6.5" fill="#1E242B"/><circle cx="49" cy="57.5" r="3.6" fill="#6FE0D4"/><circle cx="71" cy="57.5" r="3.6" fill="#6FE0D4"/><path d="M47 73h26 M47 82h26" stroke="#1E242B" stroke-width="4" stroke-linecap="round"/><path d="M60 69v18" stroke="#1E242B" stroke-width="4.5" stroke-linecap="round"/></svg></button>

<button aria-label="Kira avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;overflow:hidden"><svg aria-hidden="true" width="100%" height="100%" style="display:block;border-radius:50%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#13504F"/><path d="M24 58c0-23 16-36 36-36s36 13 36 36c0 17-2 32-6 46H30c-4-14-6-29-6-46z" fill="#C43B8A"/><path d="M60 32c16 0 26 10 26 25 0 11-3 20-8 27-5 6-11 10-18 10s-13-4-18-10c-5-7-8-16-8-27 0-15 10-25 26-25z" fill="#F7D7BE"/><path d="M34 58c0-19 11-32 26-32s26 13 26 32c-2-11-6-18-11-20-3 7-9 11-17 11-6 0-11-2-14-7-5 3-8 8-10 16z" fill="#E85AAB"/><ellipse cx="47" cy="64" rx="7.5" ry="10" fill="#FFF"/><ellipse cx="47" cy="64" rx="6" ry="9" fill="#3EA8B5"/><ellipse cx="47" cy="66" rx="3.4" ry="5" fill="#1C1830"/><circle cx="49.5" cy="59.5" r="3" fill="#FFF"/><ellipse cx="73" cy="64" rx="7.5" ry="10" fill="#FFF"/><ellipse cx="73" cy="64" rx="6" ry="9" fill="#3EA8B5"/><ellipse cx="73" cy="66" rx="3.4" ry="5" fill="#1C1830"/><circle cx="75.5" cy="59.5" r="3" fill="#FFF"/><path d="M39 55 q8 -5 16 -1 M65 54 q8 -4 16 1" stroke="#2B1F33" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M56 82 q4 4 8 0" stroke="#C4756B" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="39" cy="74" r="4" fill="#E8927E" opacity=".45"/><circle cx="81" cy="74" r="4" fill="#E8927E" opacity=".45"/></svg></button>

</div>
<div style="color:#9AA3B8;font-size:12px;font-weight:700;letter-spacing:.12em;padding:6px 4px 0">PROFILE TYPE</div>
<div role="radiogroup" aria-label="Profile type" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
<button role="radio" aria-checked="false" style="height:74px;border-radius:14px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;padding:0 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;text-align:left"><span style="font:700 15px Inter,system-ui,sans-serif">Standard</span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">Everything available</span></button>
<button role="radio" aria-checked="true" style="height:74px;border-radius:14px;border:0;background:#16233A;box-shadow:0 0 0 2px #FFC81A;color:#F2F4FA;padding:0 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;text-align:left"><span style="font:700 15px Inter,system-ui,sans-serif;display:flex;align-items:center;gap:6px">Kids<span style="font:800 10px Inter,system-ui,sans-serif;letter-spacing:.08em;color:#07080F;background:#FFC81A;border-radius:5px;padding:2px 6px">ON</span></span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">Parental limits · no Settings</span></button>
</div>
<div style="border-radius:16px;background:#0C0E18;border:1px solid #2C3150;overflow:hidden">
<button style="width:100%;min-height:72px;border:0;background:transparent;color:#F2F4FA;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;border-bottom:1px solid #1A1D2E"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:700 15px Inter,system-ui,sans-serif">Copy playlists from [Main profile]</span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">3 playlists · TV guides included</span></span><span aria-hidden="true" style="width:52px;height:30px;border-radius:15px;background:linear-gradient(90deg,#7B5CFF,#14E0E0);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#F2F4FA"></span></span></button>
<button style="width:100%;min-height:72px;border:0;background:transparent;color:#F2F4FA;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:700 15px Inter,system-ui,sans-serif">Lock with a PIN</span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">Optional · 4-digit PIN to open</span></span><span aria-hidden="true" style="width:52px;height:30px;border-radius:15px;background:#2C3150;position:relative;flex:none"><span style="position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#9AA3B8"></span></span></button>
</div>
<span style="color:#9AA3B8;font-size:12px;line-height:1.5;padding:0 4px">Copied playlists belong to this profile from now on. Changes on one profile won't affect the other.</span>
<div style="margin-top:auto;margin-bottom:20px;padding:2px;border-radius:28px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="width:100%;height:52px;border:0;border-radius:26px;background:#F2F4FA;color:#07080F;font:800 16px Inter,system-ui,sans-serif">Create profile</button></div>
</div>




</body></html>
