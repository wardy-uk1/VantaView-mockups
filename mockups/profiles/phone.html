<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Add another profile (Phone)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;padding:20px 16px 0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px">
<button aria-label="Back" style="width:44px;height:44px;border-radius:50%;border:1px solid #2C3150;background:#12141F;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<h1 style="margin:0;font-size:22px;font-weight:800">Add profile</h1>
</div>
<div style="display:flex;align-items:center;gap:14px">
<div style="padding:3px;border-radius:50%;background:linear-gradient(135deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><span style="display:flex;width:84px;height:84px;border-radius:50%;background:linear-gradient(150deg,#19E57A,#14E0E0);align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c4 3 5 8 3 13H9C7 10 8 5 12 2zM9 15l-3 4M15 15l3 4M12 9h.01"></path></svg></span></div>
<label style="flex:1;display:flex;flex-direction:column;gap:6px"><span style="color:#9AA3B8;font-size:13px;font-weight:600">Profile name</span><input placeholder="Name" style="height:48px;box-sizing:border-box;border-radius:12px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 16px Inter,system-ui,sans-serif;padding:0 14px"></label>
</div>
<div style="display:grid;grid-template-columns:repeat(8, minmax(0, 1fr));gap:6px">

<button aria-label="Star avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#2F7BFF,#7B5CFF);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"></path></svg></button>

<button aria-label="Bolt avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#FFC81A,#FF5A14);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></button>

<button aria-label="Rocket avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#19E57A,#14E0E0);box-shadow:0 0 0 2px #07080F, 0 0 0 4px #F2F4FA;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c4 3 5 8 3 13H9C7 10 8 5 12 2zM9 15l-3 4M15 15l3 4M12 9h.01"></path></svg></button>

<button aria-label="Planet avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#FF4FD8,#7B5CFF);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a6 6 0 100 12 6 6 0 000-12zM3 14c3 2 15-2 18-6"></path></svg></button>

<button aria-label="Wave avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#14E0E0,#2F7BFF);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12c3-4 6-4 9 0s6 4 9 0M3 17c3-4 6-4 9 0s6 4 9 0"></path></svg></button>

<button aria-label="Flame avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#FF5A14,#FF4F7A);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-5 3-6 0 3 3 4 3 4s-2-4 0-9z"></path></svg></button>

<button aria-label="Leaf avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#19E57A,#FFC81A);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-9 6-14 14-14 0 8-5 14-14 14zM5 19l7-7"></path></svg></button>

<button aria-label="Moon avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#7B5CFF,#14E0E0);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14A8 8 0 1110 4a6 6 0 0010 10z"></path></svg></button>

</div>
<div style="color:#9AA3B8;font-size:12px;font-weight:700;letter-spacing:.12em;padding:6px 4px 0">PROFILE TYPE</div>
<div role="radiogroup" aria-label="Profile type" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
<button role="radio" aria-checked="false" style="height:74px;border-radius:14px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;padding:0 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;text-align:left"><span style="font:700 15px Inter,system-ui,sans-serif">Standard</span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">Everything available</span></button>
<button role="radio" aria-checked="true" style="height:74px;border-radius:14px;border:0;background:#16233A;box-shadow:0 0 0 2px #FFC81A;color:#F2F4FA;padding:0 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;text-align:left"><span style="font:700 15px Inter,system-ui,sans-serif;display:flex;align-items:center;gap:6px">Kids<span style="font:800 10px Inter,system-ui,sans-serif;letter-spacing:.08em;color:#07080F;background:#FFC81A;border-radius:5px;padding:2px 6px">ON</span></span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">Parental limits · no Settings</span></button>
</div>
<div style="border-radius:16px;background:#0C0E18;border:1px solid #2C3150;overflow:hidden">
<button style="width:100%;min-height:72px;border:0;background:transparent;color:#F2F4FA;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;border-bottom:1px solid #1A1D2E"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:700 15px Inter,system-ui,sans-serif">Copy playlists from [Main profile]</span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">3 playlists · TV guides included</span></span><span aria-hidden="true" style="width:52px;height:30px;border-radius:15px;background:linear-gradient(90deg,#7B5CFF,#14E0E0);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#F2F4FA"></span></span></button>
<button style="width:100%;min-height:72px;border:0;background:transparent;color:#F2F4FA;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:700 15px Inter,system-ui,sans-serif">Lock with a PIN</span><span style="font:500 12px Inter,system-ui,sans-serif;color:#9AA3B8">Optional · 4-digit PIN to open</span></span><span aria-hidden="true" style="width:52px;height:30px;border-radius:15px;background:#2C3150;position:relative;flex:none"><span style="position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#9AA3B8"></span></span></button>
</div>
<span style="color:#9AA3B8;font-size:12px;line-height:1.5;padding:0 4px">Copied playlists belong to this profile from now on. Changes on one profile won't affect the other.</span>
<div style="margin-top:auto;margin-bottom:20px;padding:2px;border-radius:28px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="width:100%;height:52px;border:0;border-radius:26px;background:#F2F4FA;color:#07080F;font:800 16px Inter,system-ui,sans-serif">Create profile</button></div>
</div>




</body></html>
