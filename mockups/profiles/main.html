<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Create your profile (TV)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:1280px;height:720px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;padding:36px 64px 0;display:flex;flex-direction:column;align-items:center;gap:22px">
<svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1280 720" fill="none" stroke-width="1.5" style="position:absolute;inset:0;opacity:.08;pointer-events:none"><path d="M0 120H180L210 150H320" stroke="#7B5CFF"></path><circle cx="320" cy="150" r="5" stroke="#7B5CFF"></circle><path d="M1280 600H1100L1070 570H960" stroke="#FFC81A"></path><circle cx="960" cy="570" r="5" stroke="#FFC81A"></circle><path d="M0 640H140L170 610H260" stroke="#14E0E0"></path><path d="M1280 90H1150L1120 120H1040" stroke="#FF4FD8"></path></svg>
<div style="position:relative;display:flex;align-items:center;gap:10px" aria-label="Step 2 of 3">
<span style="width:40px;height:6px;border-radius:3px;background:#2C3150"></span>
<span style="width:72px;height:6px;border-radius:3px;background:linear-gradient(90deg,#7B5CFF,#14E0E0)"></span>
<span style="width:40px;height:6px;border-radius:3px;background:#2C3150"></span>
<span style="margin-left:8px;color:#9AA3B8;font-size:14px;font-weight:600">Step 2 of 3 · Profile</span>
</div>
<h1 style="position:relative;margin:0;font-size:40px;font-weight:800">Who's watching?</h1>
<p style="position:relative;margin:-10px 0 0;color:#C3C9D8;font-size:18px">Create your profile. You can add more people later in Settings.</p>
<div style="position:relative;display:flex;gap:56px;align-items:flex-start;margin-top:8px">
<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="padding:4px;border-radius:50%;background:linear-gradient(135deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14);box-shadow:0 0 32px rgba(20,224,224,.35)"><span style="display:flex;width:168px;height:168px;border-radius:50%;background:linear-gradient(150deg,#2F7BFF,#7B5CFF);align-items:center;justify-content:center"><svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"></path></svg></span></div>
<span style="color:#9AA3B8;font-size:14px">Pick an avatar below</span>
</div>
<div style="width:520px;display:flex;flex-direction:column;gap:16px">
<label style="display:flex;flex-direction:column;gap:8px"><span style="color:#9AA3B8;font-size:15px;font-weight:600">Profile name</span><input placeholder="Your name" style="height:60px;box-sizing:border-box;border-radius:16px;border:2px solid #14E0E0;background:#12141F;color:#F2F4FA;font:600 20px Inter,system-ui,sans-serif;padding:0 18px"></label>
<div style="display:grid;grid-template-columns:repeat(8, minmax(0, 1fr));gap:10px">

<button aria-label="Star avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#2F7BFF,#7B5CFF);box-shadow:0 0 0 3px #07080F, 0 0 0 5px #F2F4FA;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"></path></svg></button>

<button aria-label="Bolt avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#FFC81A,#FF5A14);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></button>

<button aria-label="Rocket avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#19E57A,#14E0E0);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c4 3 5 8 3 13H9C7 10 8 5 12 2zM9 15l-3 4M15 15l3 4M12 9h.01"></path></svg></button>

<button aria-label="Planet avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#FF4FD8,#7B5CFF);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a6 6 0 100 12 6 6 0 000-12zM3 14c3 2 15-2 18-6"></path></svg></button>

<button aria-label="Wave avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#14E0E0,#2F7BFF);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12c3-4 6-4 9 0s6 4 9 0M3 17c3-4 6-4 9 0s6 4 9 0"></path></svg></button>

<button aria-label="Flame avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#FF5A14,#FF4F7A);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-5 3-6 0 3 3 4 3 4s-2-4 0-9z"></path></svg></button>

<button aria-label="Leaf avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#19E57A,#FFC81A);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-9 6-14 14-14 0 8-5 14-14 14zM5 19l7-7"></path></svg></button>

<button aria-label="Moon avatar" style="aspect-ratio:1/1;border:0;padding:0;border-radius:50%;background:linear-gradient(150deg,#7B5CFF,#14E0E0);box-shadow:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14A8 8 0 1110 4a6 6 0 0010 10z"></path></svg></button>

</div>
<button style="height:64px;border:0;border-radius:16px;background:#12141F;color:#F2F4FA;padding:0 18px;display:flex;align-items:center;gap:14px;text-align:left"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:700 17px Inter,system-ui,sans-serif">Lock with a PIN</span><span style="font:500 13px Inter,system-ui,sans-serif;color:#9AA3B8">Optional · ask for a 4-digit PIN when this profile opens</span></span><span aria-hidden="true" style="width:56px;height:32px;border-radius:16px;background:#2C3150;position:relative;flex:none"><span style="position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#9AA3B8"></span></span></button>
</div>
</div>
<div style="position:relative;margin-top:auto;margin-bottom:34px;padding:3px;border-radius:32px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0,#19E57A,#FFC81A,#FF5A14)"><button style="height:58px;padding:0 64px;border:0;border-radius:29px;background:#F2F4FA;color:#07080F;font:800 19px Inter,system-ui,sans-serif">Continue to add a playlist</button></div>
</div>




</body></html>
