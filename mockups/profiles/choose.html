<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Choose profile (TV)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:1280px;height:720px;box-sizing:border-box;background:#07080F;color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px">
<svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1280 720" fill="none" stroke-width="1.5" style="position:absolute;inset:0;opacity:.08;pointer-events:none"><path d="M0 120H180L210 150H320" stroke="#7B5CFF"></path><circle cx="320" cy="150" r="5" stroke="#7B5CFF"></circle><path d="M1280 600H1100L1070 570H960" stroke="#FFC81A"></path><circle cx="960" cy="570" r="5" stroke="#FFC81A"></circle></svg>
<svg width="64" height="64" viewBox="0 0 44 44" role="img" aria-label="VantaView" style="position:absolute;left:56px;top:40px"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B5CFF"></stop><stop offset="1" stop-color="#14E0E0"></stop></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A14"></stop><stop offset=".5" stop-color="#FFC81A"></stop><stop offset="1" stop-color="#19E57A"></stop></linearGradient></defs><path d="M8 8L19 34" stroke="url(#gl)" stroke-width="7" stroke-linecap="round"></path><path d="M36 8L22 35" stroke="url(#gr)" stroke-width="7" stroke-linecap="round"></path><path d="M17 13L28 19L17 25Z" fill="#FF4F7A" stroke="#07080F" stroke-width="2" stroke-linejoin="round"></path></svg>
<h1 style="position:relative;margin:0;font-size:44px;font-weight:800">Who's watching?</h1>
<div style="position:relative;display:flex;gap:40px;align-items:flex-start">

<button style="width:170px;border:0;background:transparent;color:#F2F4FA;padding:0;display:flex;flex-direction:column;align-items:center;gap:14px;transform:scale(1.06)">
<span style="position:relative;display:flex;width:160px;height:160px;border-radius:50%;background:linear-gradient(150deg,#2F7BFF,#7B5CFF);box-shadow:0 0 0 4px #07080F, 0 0 0 8px #14E0E0, 0 0 30px rgba(20,224,224,.5);align-items:center;justify-content:center"><svg width="78" height="78" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"></path></svg>

</span>
<span style="font:700 20px Inter,system-ui,sans-serif;color:#F2F4FA">[Main profile]</span>

</button>

<button style="width:170px;border:0;background:transparent;color:#F2F4FA;padding:0;display:flex;flex-direction:column;align-items:center;gap:14px;transform:none">
<span style="position:relative;display:flex;width:160px;height:160px;border-radius:50%;background:linear-gradient(150deg,#FF4FD8,#7B5CFF);box-shadow:none;align-items:center;justify-content:center"><svg width="78" height="78" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a6 6 0 100 12 6 6 0 000-12zM3 14c3 2 15-2 18-6"></path></svg>
<span style="position:absolute;right:6px;bottom:6px;width:40px;height:40px;border-radius:50%;background:#07080F;border:2px solid #2C3150;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="PIN locked"><path d="M6 11h12v9H6zM9 11V8a3 3 0 016 0v3"></path></svg></span>
</span>
<span style="font:700 20px Inter,system-ui,sans-serif;color:#C3C9D8">[Profile 2]</span>

</button>

<button style="width:170px;border:0;background:transparent;color:#F2F4FA;padding:0;display:flex;flex-direction:column;align-items:center;gap:14px;transform:none">
<span style="position:relative;display:flex;width:160px;height:160px;border-radius:50%;background:linear-gradient(150deg,#19E57A,#14E0E0);box-shadow:none;align-items:center;justify-content:center"><svg width="78" height="78" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c4 3 5 8 3 13H9C7 10 8 5 12 2zM9 15l-3 4M15 15l3 4M12 9h.01"></path></svg>

</span>
<span style="font:700 20px Inter,system-ui,sans-serif;color:#C3C9D8">[Kids]</span>
<span style="margin-top:-6px;font:800 12px Inter,system-ui,sans-serif;letter-spacing:.08em;color:#07080F;background:#FFC81A;border-radius:6px;padding:3px 8px">KIDS</span>
</button>

<button style="width:170px;border:0;background:transparent;color:#9AA3B8;padding:0;display:flex;flex-direction:column;align-items:center;gap:14px"><span style="display:flex;width:156px;height:156px;border-radius:50%;border:2px dashed #2C3150;align-items:center;justify-content:center"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span><span style="font:700 20px Inter,system-ui,sans-serif">Add profile</span></button>
</div>
<button style="position:relative;height:50px;padding:0 26px;border-radius:25px;border:1px solid #2C3150;background:#12141F;color:#F2F4FA;font:600 16px Inter,system-ui,sans-serif">Manage profiles</button>
</div>




</body></html>
