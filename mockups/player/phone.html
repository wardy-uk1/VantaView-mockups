<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>VantaView – Movie player (Phone, landscape)</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<meta name="viewport" content="width=device-width"><style>html{background:#000}body{margin:0;display:flex;justify-content:center}</style></head>
<body>


<div style="position:relative;width:844px;height:390px;box-sizing:border-box;background:linear-gradient(135deg,#1E1546 0%,#0E3A4A 55%,#3A2410 100%);color:#F2F4FA;font-family:Inter,system-ui,sans-serif;overflow:hidden">
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(7,8,15,.45)"></div>
<div style="position:absolute;left:24px;right:24px;top:16px;display:flex;align-items:center;gap:10px">
<button aria-label="Back" style="width:44px;height:44px;border-radius:50%;border:0;background:rgba(7,8,15,.6);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<span style="font-size:17px;font-weight:700">[Movie title]</span>
<button style="margin-left:auto;height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(7,8,15,.6);color:#F2F4FA;font:800 14px Inter,system-ui,sans-serif">1×</button>
<button aria-label="Audio and subtitles" style="width:44px;height:44px;border-radius:50%;border:0;background:rgba(7,8,15,.6);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v12H3zM7 14h4M13 14h4"></path></svg></button>
<button aria-label="Picture size" style="width:44px;height:44px;border-radius:50%;border:0;background:rgba(7,8,15,.6);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
</div>
<div style="position:absolute;left:24px;top:140px;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(242,244,250,.6);font-size:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg><span style="display:block;width:4px;height:60px;border-radius:2px;background:rgba(242,244,250,.25)"><span style="display:block;width:4px;height:36px;margin-top:24px;border-radius:2px;background:#F2F4FA"></span></span>Brightness</div>
<div style="position:absolute;right:24px;top:140px;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(242,244,250,.6);font-size:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6"></path></svg><span style="display:block;width:4px;height:60px;border-radius:2px;background:rgba(242,244,250,.25)"><span style="display:block;width:4px;height:44px;margin-top:16px;border-radius:2px;background:#F2F4FA"></span></span>Volume</div>
<div style="position:absolute;left:0;right:0;top:146px;display:flex;align-items:center;justify-content:center;gap:56px">
<button aria-label="Back 10 seconds" style="width:56px;height:56px;border-radius:50%;border:0;background:rgba(7,8,15,.55);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 108-8H8M8 1L5 4l3 3"></path></svg></button>
<button aria-label="Pause" style="width:76px;height:76px;border-radius:50%;border:0;background:#F2F4FA;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(7,8,15,.5),0 0 0 6px #14E0E0"><svg width="30" height="30" viewBox="0 0 24 24" fill="#07080F" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"></path></svg></button>
<button aria-label="Forward 10 seconds" style="width:56px;height:56px;border-radius:50%;border:0;background:rgba(7,8,15,.55);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 11-8-8h4M16 1l3 3-3 3"></path></svg></button>
</div>
<div style="position:absolute;left:24px;right:24px;bottom:18px;display:flex;align-items:center;gap:12px">
<span style="font-size:13px;color:#C3C9D8">1:20:14</span>
<div style="position:relative;flex:1;height:6px;border-radius:3px;background:rgba(242,244,250,.2)"><span style="position:absolute;left:0;top:0;height:6px;width:62%;border-radius:3px;background:linear-gradient(90deg,#7B5CFF,#2F7BFF,#14E0E0)"></span><span aria-hidden="true" style="position:absolute;left:62%;top:-6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#F2F4FA"></span></div>
<span style="font-size:13px;color:#C3C9D8">2:08:00</span>
<button aria-label="Lock screen" style="width:44px;height:44px;border-radius:50%;border:0;background:rgba(7,8,15,.6);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 016 0v3"></path></svg></button>
</div>
</div>




</body></html>
